name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The test suite uses only the built-in node test runner, so there is
      # nothing to install. Wrangler is pulled in by Cloudflare at deploy time.
      - run: npm test
